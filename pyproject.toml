[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-cognitive-architecture"
version = "0.1.0"
description = "Local, traceable sequential orchestration for heterogeneous AI systems"
requires-python = ">=3.11"
authors = [{name = "UCA contributors"}]
license = {text = "MIT"}

[project.optional-dependencies]
models = ["torch>=2.1", "transformers>=4.42", "accelerate>=0.30"]
train = ["torch>=2.1", "transformers>=4.42", "accelerate>=0.30"]
dev = ["pytest>=8"]

[project.scripts]
uca = "uca.cli:main"

[tool.setuptools]
packages = ["uca"]

[tool.unittest]
start-directory = "tests"
